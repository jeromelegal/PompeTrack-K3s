    APP_PATH: apps/worker-stream
  rules:
    - changes:
        - apps/worker-stream/**

build_medplum_provider:
  extends: .build_app
  variables:
    APP_NAME: medplum-provider
    APP_PATH: apps/medplum-provider
  rules:
    - changes:
        - apps/medplum-provider/**

build_pg_backup:
  extends: .build_app
  variables:
    APP_NAME: pg-backup
    APP_PATH: apps/pg-backup
  rules:
    - changes:
        - apps/pg-backup/**

build_pg_pompetrack:
  extends: .build_app
  variables:
    APP_NAME: pgsql-pompetrack-core
    APP_PATH: apps/pgsql-pompetrack-core
  rules:
    - changes:
        - apps/pgsql-pompetrack-core/**

build_agent_backend:
  extends: .build_app
  variables:
    APP_NAME: agent-backend
    APP_PATH: apps/agent-backend
  rules:

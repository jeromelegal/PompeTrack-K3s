stages:
  - build

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

default:
  image: docker:27
  services:
    - docker:27-dind

  before_script:
    - apk add --no-cache ca-certificates && update-ca-certificates
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker info
    - docker logout "$CI_REGISTRY" || true
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

.build_template:
  stage: build
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/$APP_NAME:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/$APP_NAME:latest" "$APP_PATH"
    - echo "CI_REGISTRY=$CI_REGISTRY"
    - echo "CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE"
    - nslookup "$CI_REGISTRY" || true
    - apk add --no-cache curl || true
    - curl -vk "https://$CI_REGISTRY/v2/" || true
    - docker info
    - docker push "$CI_REGISTRY_IMAGE/$APP_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/$APP_NAME:latest"

build_ingestion:
  extends: .build_template
  variables:
    APP_NAME: ingestion
    APP_PATH: apps/ingestion
  rules:
    - changes:
        - apps/ingestion/**
    - when: always

build_streamlit:
  extends: .build_template
  variables:
    APP_NAME: streamlit
    APP_PATH: apps/streamlit
  rules:
    - changes:
        - apps/streamlit/**

build_worker_fhir:
  extends: .build_template
  variables:
    APP_NAME: worker-fhir
    APP_PATH: apps/worker-fhir
  rules:
    - changes:
        - apps/worker-fhir/**

build_worker_sqlite:
  extends: .build_template
  variables:
    APP_NAME: worker-sqlite
    APP_PATH: apps/worker-sqlite
  rules:
    - changes:
        - apps/worker-sqlite/**

build_worker_stream:
  extends: .build_template
  variables:
    APP_NAME: worker-stream
    APP_PATH: apps/worker-stream
  rules:
    - changes:
        - apps/worker-stream/**

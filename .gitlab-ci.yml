stages: [build]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  GIT_DEPTH: "0"

default:
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache ca-certificates git && update-ca-certificates
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

.build_app:
  stage: build
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/$APP_NAME:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/$APP_NAME:latest" "$APP_PATH"
    - docker push "$CI_REGISTRY_IMAGE/$APP_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/$APP_NAME:latest"

build_ingestion:
  extends: .build_app
  variables:
    APP_NAME: ingestion
    APP_PATH: apps/ingestion
  rules:
    - changes:
        - apps/ingestion/**

build_streamlit:
  extends: .build_app
  variables:
    APP_NAME: streamlit
    APP_PATH: apps/streamlit
  before_script:
    - apk add --no-cache ca-certificates git && update-ca-certificates
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - cp "$GOOGLE_CREDENTIALS_JSON" apps/streamlit/credentials.json
  rules:
    - changes:
        - apps/streamlit/**

build_worker_fhir:
  extends: .build_app
  variables:
    APP_NAME: worker-fhir
    APP_PATH: apps/worker-fhir
  rules:
    - changes:
        - apps/worker-fhir/**

build_worker_sqlite:
  extends: .build_app

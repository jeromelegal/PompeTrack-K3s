map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name provider.phylcero.fr;

    #access_by_lua_file /usr/share/ssowat/access.lua;

    include /etc/nginx/conf.d/acme-challenge.conf.inc;

    location ^~ '/.well-known/ynh-diagnosis/' {
        alias /var/www/.well-known/ynh-diagnosis/;
    }

    location ^~ '/.well-known/autoconfig/mail/' {
        alias /var/www/.well-known/provider.phylcero.fr/autoconfig/mail/;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/conf.d/yunohost_http_errors.conf.inc;

    access_log /var/log/nginx/provider.phylcero.fr-access.log;
    error_log /var/log/nginx/provider.phylcero.fr-error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name provider.phylcero.fr;

    include /etc/nginx/conf.d/security.conf.inc;

    ssl_certificate /etc/yunohost/certs/provider.phylcero.fr/crt.pem;
    ssl_certificate_key /etc/yunohost/certs/provider.phylcero.fr/key.pem;

    more_set_headers "Strict-Transport-Security : max-age=63072000; includeSubDomains; preload";

    location ^~ '/.well-known/autoconfig/mail/' {
        alias /var/www/.well-known/provider.phylcero.fr/autoconfig/mail/;
    }

    #access_by_lua_file /usr/share/ssowat/access.lua;

    include /etc/nginx/conf.d/provider.phylcero.fr.d/*.conf;

    include /etc/nginx/conf.d/yunohost_sso.conf.inc;
    include /etc/nginx/conf.d/yunohost_admin.conf.inc;
    include /etc/nginx/conf.d/yunohost_api.conf.inc;
    include /etc/nginx/conf.d/yunohost_http_errors.conf.inc;

    access_log /var/log/nginx/provider.phylcero.fr-access.log;
    error_log /var/log/nginx/provider.phylcero.fr-error.log;
}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: pompetrack-core
spec:
  template:
    spec:
      containers:
        - name: ingestion
          readinessProbe:
            httpGet:
              path: /
              port: 80
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 80
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /
              port: 80
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 60

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-medplum-egress-to-minio-api
  namespace: medplum
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: medplum
  policyTypes: ["Egress"]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pompetrack-core
      podSelector:
        matchLabels:
          app: minio
    ports:
    - {protocol: TCP, port: 9000}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-medplum-from-llm-agent
  namespace: medplum
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: medplum
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: llm-agent
      podSelector:
        matchExpressions:
          - key: app
            operator: In
            values:
              - agent-backend
              - agent-backend-mcpo
              - health-coach
              - health-coach-weekly
              - health-evening-questions
    ports:
    - protocol: TCP
      port: 8103
    - protocol: TCP
      port: 80

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-medplum-to-llm-agent
  namespace: llm-agent
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - agent-backend
          - agent-backend-mcpo
          - health-coach
          - health-coach-weekly
          - health-evening-questions
  policyTypes: ["Egress"]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: medplum
      podSelector:
        matchLabels:
          app.kubernetes.io/name: medplum
    ports:
    - protocol: TCP
      port: 8103
    - protocol: TCP
      port: 80

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-egress-to-medplum
  namespace: llm-agent
spec:
  podSelector:
    matchLabels:
      app: agent-backend
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: medplum
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: medplum
    ports:
    - protocol: TCP
      port: 80
    - port: 8103
      protocol: TCP

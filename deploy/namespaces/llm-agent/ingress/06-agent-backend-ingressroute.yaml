apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: agent-backend-lan
  namespace: llm-agent
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`agent-backend.lan`) || Host(`agent-backend.192.168.2.88.nip.io`)
      kind: Rule
      middlewares:
        - name: lan-only
          namespace: llm-agent
      services:
        - name: agent-backend
          port: 8000

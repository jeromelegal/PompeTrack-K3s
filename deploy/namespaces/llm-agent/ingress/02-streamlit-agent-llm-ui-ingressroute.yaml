apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: streamlit-ui-lan
  namespace: llm-agent
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`streamlit-agent-llm.lan`) || Host(`llm-agent.192.168.2.88.nip.io`)
      kind: Rule
      middlewares:
        - name: lan-only
          namespace: llm-agent 
      services:
        - name: streamlit-agent-llm
          port: 8501
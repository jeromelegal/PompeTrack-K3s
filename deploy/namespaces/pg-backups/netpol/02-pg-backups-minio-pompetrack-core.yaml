apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio-pompetrack-core-from-pg-backups
  namespace: pompetrack-core
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pg-backups
      podSelector: {}
    ports:
    - protocol: TCP
      port: 9000

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio-pompetrack-core-to-pg-backups
  namespace: pg-backups
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pompetrack-core
      podSelector:
        matchLabels:
          app: minio
    ports:
    - protocol: TCP
      port: 9000

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker-sqlite-ingress
  namespace: pompetrack-core
spec:
  podSelector:
    matchLabels:
      app: worker-sqlite
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pompetrack-core
    ports:
    - protocol: TCP
      port: 80

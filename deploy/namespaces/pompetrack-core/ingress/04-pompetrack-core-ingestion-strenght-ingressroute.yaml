apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingestion-strength-public
  namespace: pompetrack-core
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`ingestion.lan`) && PathPrefix(`/ingest/strength`)
      kind: Rule
      services:
        - name: ingestion
          port: 80
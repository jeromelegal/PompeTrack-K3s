---
# Monitoring namespace : PERMISSIVE global
# Prometheus lui-même n'a pas besoin de mTLS pour être scrapé
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: monitoring-permissive
  namespace: monitoring
spec:
  mtls:
    mode: PERMISSIVE
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: medplum-metrics-permissive
  namespace: medplum
spec:
  selector:
    matchLabels:
      app: exporter
  mtls:
    mode: STRICT
  portLevelMtls:
    9187:   # postgres-exporter
      mode: PERMISSIVE
    9121:   # redis-exporter
      mode: PERMISSIVE

---

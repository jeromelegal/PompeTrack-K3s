apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-app-to-server
  namespace: medplum
spec:
  podSelector:
    matchLabels:
      app: medplum-provider
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: medplum
      ports:
        - protocol: TCP
          port: 8103
        - protocol: TCP
          port: 80
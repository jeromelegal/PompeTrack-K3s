apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker-fhir-to-medplum
  namespace: medplum
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: medplum
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pompetrack-core
      podSelector:
        matchLabels:
          app: worker-fhir
    ports:
    - protocol: TCP
      port: 80

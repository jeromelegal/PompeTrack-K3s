apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-to-medplum
  namespace: medplum
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: medplum
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: llm-agent
      podSelector:
        matchExpressions:
          - key: app
            operator: In
            values:
              - agent-backend
              - agent-backend-mcpo
              - health-coach
              - health-coach-weekly
              - health-evening-questions
    ports:
    - protocol: TCP
      port: 80
    - port: 8103
      protocol: TCP

apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: llm-agent
data:
  settings.yml: |
    use_default_settings:
      engines:
        remove:
          - wikidata
          - ahmia
          - torch

    server:
      secret_key: "CHANGE_ME_RANDOM_SECRET"
      bind_address: "0.0.0.0"
      port: 8080
      limiter: false

    search:
      formats:
        - html
        - json

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: llm-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      enableServiceLinks: false
      containers:
        - name: searxng
          image: searxng/searxng:latest
          ports:
            - containerPort: 8080
          env:
            - name: SEARXNG_SETTINGS_PATH
              value: "/etc/searxng/settings.yml"
            - name: GRANIAN_PORT
              value: "8080"
          volumeMounts:
            - name: searxng-settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
      volumes:
        - name: searxng-settings
          configMap:
            name: searxng-settings
            items:
              - key: settings.yml
                path: settings.yml

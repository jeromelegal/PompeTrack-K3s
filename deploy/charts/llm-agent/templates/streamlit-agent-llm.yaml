apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-agent-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit-agent-llm
  template:
    metadata:
      labels:
        app: streamlit-agent-llm
    spec:
      serviceAccountName: streamlit-agent-llm
      imagePullSecrets:
        - name: gitlab-regcred
      containers:
        - name: streamlit-agent-llm
          image: registry.phylcero.fr/garth/pompetrack/streamlit-agent-llm:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          env:
            - BACKEND_BASE_URL: http://agent-backend:8000
            - name: BACKEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-api-key
                  key: secret_key
            - WORKSPACE_ROOT: /workspace
            - DATA_DIR: /data
            - STATE_DB_PATH: /data/app.sqlite
            - CHECKPOINT_DB_PATH: /data/langgraph-checkpoints.sqlite
            - QDRANT_URL: http://qdrant:6333
            - QDRANT_COLLECTION: documents
          volumeMounts:
            - name: agent-data
              mountPath: /data
            - name: agent-workspace
              mountPath: /workspace
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: 8501
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: 8501
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8501
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: agent-backend-data
        - name: agent-workspace
          persistentVolumeClaim:
            claimName: agent-backend-workspace

---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-agent-llm
spec:
  selector:
    app: streamlit-agent-llm
  ports:
    - name: http
      port: 8501
      targetPort: 8501
  type: ClusterIP
medplum:
  global:
    cloudProvider: ""

  namespace: medplum

  deployment:
    replicaCount: 1
    image:
      repository: medplum/medplum-server
      tag: "5.1.1"

    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

    autoscaling:
      enabled: false

    env:
      - name: MEDPLUM_BASE_URL
        value: "https://medplum.phylcero.fr/api"
      - name: MEDPLUM_PORT
        value: "8103"
      - name: MEDPLUM_APP_BASE_URL
        value: "https://medplum.phylcero.fr"
      - name: MEDPLUM_ALLOWED_ORIGINS
        value: "https://medplum.phylcero.fr"
      - name: MEDPLUM_DATABASE_HOST
        value: "medplum-postgresql"
      - name: MEDPLUM_DATABASE_PORT
        value: "5432"
      - name: MEDPLUM_DATABASE_DBNAME
        value: "medplum"
      - name: MEDPLUM_DATABASE_USERNAME
        value: "medplum"
      - name: MEDPLUM_DATABASE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: pompetrack-postgres-auth
            key: password

      - name: MEDPLUM_REDIS_HOST
        value: "medplum-redis-master"
      - name: MEDPLUM_REDIS_PORT
        value: "6379"

      - name: MEDPLUM_RECAPTCHA_SITE_KEY
        valueFrom:
          secretKeyRef:
            name: recaptcha-site-key
            key: siteKey
      - name: MEDPLUM_RECAPTCHA_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: recaptcha-secret-key
            key: secretKey

      - name: MEDPLUM_DEFAULT_SUPER_ADMIN_EMAIL
        value: "root@phylcero.fr"
      - name: MEDPLUM_DEFAULT_SUPER_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: medplum-superadmin
            key: password

      - name: MEDPLUM_BINARY_STORAGE
        value: "file:/data/medplum-binary/"
      - name: MEDPLUM_STORAGE_BASE_URL
        value: "https://medplum.phylcero.fr/api/storage/"

    revisionHistoryLimit: 3

  service:
    type: ClusterIP
    port: 80

  ingress:
    deploy: false

  podDisruptionBudget:
    enabled: false

postgresql:
  auth:
    username: medplum
    database: medplum
    existingSecret: pompetrack-postgres-auth
    secretKeys:
      userPasswordKey: password
      adminPasswordKey: postgres-password
  primary:
    persistence:
      enabled: true
      storageClass: local-path
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

redis:
  auth:
    enabled: false
  architecture: standalone
  master:
    persistence:
      enabled: true
      storageClass: local-path


prometheus-postgres-exporter:
  enabled: true
  fullnameOverride: "medplum-postgres-exporter"
  config:
    datasource:
      host: "medplum-postgresql.medplum.svc.cluster.local"
      user: "postgres"
      passwordSecret:
        name: pompetrack-postgres-auth
        key: postgres-password
      port: "5432"
      database: "medplum"
      sslmode: disable

redis-exporter:
  enabled: true
  fullnameOverride: "redis-exporter"
  redisAddress: "redis://medplum-redis-master.medplum.svc.cluster.local:6379"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: medplum-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medplum-provider
  template:
    metadata:
      labels:
        app: medplum-provider
      annotations:
        checksum/recaptcha-site-key: {{ include "pompetrack.secretChecksum" (list "recaptcha-site-key" .) | quote }}
    spec:
      serviceAccountName: streamlit
      imagePullSecrets:
        - name: gitlab-regcred
      containers:
        - name: medplum-provider
          image: registry.phylcero.fr/garth/pompetrack/medplum-provider:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3020
          env:
            # - name: MEDPLUM_BASE_URL
            #   value: "https://medplum.phylcero.fr/api"
            - name: RECAPTCHA_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: recaptcha-site-key
                  key: siteKey
            - name: MEDPLUM_BASE_URL
              value: "http://medplum-mesh.medplum.svc.cluster.local:8103"
            - name: MEDPLUM_TOKEN_ENDPOINT
              value: "http://medplum-mesh.medplum.svc.cluster.local:8103/oauth2/token"
            - name: MEDPLUM_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: provider-medplum-client
                  key: MEDPLUM_CLIENT_ID
          readinessProbe:
            httpGet:
              path: /
              port: 3020
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3020
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: medplum-provider
spec:
  selector:
    app: medplum-provider
  ports:
    - name: http
      port: 3020
      targetPort: 3020
  type: ClusterIP

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.postgresql.fullnameOverride }}
spec:
  serviceName: {{ .Values.postgresql.fullnameOverride }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.postgresql.fullnameOverride }}
  template:
    metadata:
      labels:
        app: {{ .Values.postgresql.fullnameOverride }}
    spec:
      imagePullSecrets:
        - name: gitlab-regcred

      containers:
        - name: postgres
          image: registry.phylcero.fr/garth/pompetrack/pgsql-pompetrack-core:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}

            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: password

            - name: ADMIN_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: postgres-password

          resources:
{{ toYaml .Values.postgresql.primary.resources | indent 12 }}

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.postgresql.primary.persistence.size }}
        {{- if .Values.postgresql.primary.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.primary.persistence.storageClass | quote }}
        {{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: pompetrack-core
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: minio-init
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
          env:
            - name: MINIO_ENDPOINT
              value: "http://pompetrack-core-minio:9000"

            # Root (admin)
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword

            # Identité S3 dédiée aux backups Postgres
            - name: PG_BACKUP_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-pg-creds
                  key: pgBackupAccessKey
            - name: PG_BACKUP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-pg-creds
                  key: pgBackupSecretKey

            # Identité S3 dédiée à ton futur pod API
            - name: API_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-app-creds
                  key: apiAccessKey
            - name: API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-app-creds
                  key: apiSecretKey
            - name: CONSOLE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-console-creds
                  key: consoleAccessKey
            - name: CONSOLE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-console-creds
                  key: consoleSecretKey
            - name: AIRFLOW_LOGS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-airflow-logs-creds
                  key: airflowLogsAccessKey
            - name: AIRFLOW_LOGS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-airflow-logs-creds
                  key: airflowLogsSecretKey
            - name: AIRFLOW_LOGS_RETENTION_DAYS
              value: {{ .Values.minio.airflowLogsRetentionDays | default 7 | quote }}
            - name: PROMETHEUS_USER
              valueFrom:
                secretKeyRef:
                  name: minio-prom-credentials
                  key: username
            - name: PROMETHEUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-prom-credentials
                  key: password
            - name: MEDPLUM_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-medplum-credentials
                  key: username
            - name: MEDPLUM_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-medplum-credentials
                  key: password

          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -euo pipefail

              echo "==> Configure alias"
              echo "==> Waiting for MinIO to be ready at $MINIO_ENDPOINT"
              for i in $(seq 1 60); do
                if mc alias set local "$MINIO_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; then
                  echo "MinIO is ready."
                  break
                fi
                echo "Waiting... ($i/60)"
                sleep 2
              done

              # Dernier essai en mode verbeux (si ça échoue on veut l'erreur)
              mc alias set local "$MINIO_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"

              echo "==> Create buckets (ignore if already exists)"
              # Buckets
              mc mb --ignore-existing local/pg-backups
              mc mb --ignore-existing local/raw-iphone
              mc mb --ignore-existing local/raw-manual
              mc mb --ignore-existing local/raw-spirometer
              mc mb --ignore-existing local/raw-db-spirometer
              mc mb --ignore-existing local/processed-fhir
              mc mb --ignore-existing local/processed-db
              mc mb --ignore-existing local/blood-test
              mc mb --ignore-existing local/reports
              mc mb --ignore-existing local/raw-strength
              mc mb --ignore-existing local/fhir-logs
              mc mb --ignore-existing local/medplum-storage
              mc mb --ignore-existing local/raw-medication

              echo "==> Enable versioning on selected buckets (ignore errors if already enabled)"
              mc version enable local/pg-backups || true
              mc version enable local/processed-fhir || true
              mc version enable local/processed-db || true
              mc version enable local/reports || true
              mc version enable local/medplum-storage || true

              echo "==> Ensure users exist (users are S3 access key / secret key)"
              # pgbackup identity
              if mc admin user info local "$PG_BACKUP_ACCESS_KEY" >/dev/null 2>&1; then
                echo "User $PG_BACKUP_ACCESS_KEY already exists"
              else
                mc admin user add local "$PG_BACKUP_ACCESS_KEY" "$PG_BACKUP_SECRET_KEY"
              fi

              # api identity
              if mc admin user info local "$API_ACCESS_KEY" >/dev/null 2>&1; then
                echo "User $API_ACCESS_KEY already exists"
              else
                mc admin user add local "$API_ACCESS_KEY" "$API_SECRET_KEY"
              fi
              if mc admin user info local "$CONSOLE_ACCESS_KEY" >/dev/null 2>&1; then
                echo "User $CONSOLE_ACCESS_KEY already exists"
              else
                mc admin user add local "$CONSOLE_ACCESS_KEY" "$CONSOLE_SECRET_KEY"
              fi
              if mc admin user info local "$MEDPLUM_ACCESS_KEY" >/dev/null 2>&1; then
                echo "User $MEDPLUM_ACCESS_KEY already exists"
              else
                mc admin user add local "$MEDPLUM_ACCESS_KEY" "$MEDPLUM_SECRET_KEY"
              fi

              echo "==> (Re)create policies"

              # Policy: pgbackup => ONLY pg-backups bucket
              cat >/tmp/pgbackup-policy.json <<'EOF'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": [
                      "s3:GetBucketLocation",
                      "s3:ListBucket"
                    ],
                    "Resource": [
                      "arn:aws:s3:::pg-backups"
                    ]
                  },
                  {
                    "Effect": "Allow",
                    "Action": [
                      "s3:GetObject",
                      "s3:PutObject",
                      "s3:DeleteObject"
                    ],
                    "Resource": [
                      "arn:aws:s3:::pg-backups/*"
                    ]
                  }
                ]
              }
              EOF

              # Policy: medplum => ONLY medplum-storage bucket
              cat >/tmp/medplum-policy.json <<'EOF'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": [
                      "s3:GetBucketLocation",
                      "s3:ListBucket"
                    ],
                    "Resource": [
                      "arn:aws:s3:::medplum-storage"
                    ]
                  },
                  {
                    "Effect": "Allow",
                    "Action": [
                      "s3:GetObject",
                      "s3:PutObject",
                      "s3:DeleteObject"
                    ],
                    "Resource": [
                      "arn:aws:s3:::medplum-storage/*"
                    ]
                  }
                ]
              }
              EOF

              # Policy: api => RW sur les buckets applicatifs (pas pg-backups)
              cat >/tmp/api-policy.json <<'EOF'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": [
                      "s3:GetBucketLocation",
                      "s3:ListBucket"
                    ],
                    "Resource": [
                      "arn:aws:s3:::raw-iphone",
                      "arn:aws:s3:::raw-manual",
                      "arn:aws:s3:::raw-spirometer",
                      "arn:aws:s3:::raw-db-spirometer",
                      "arn:aws:s3:::processed-fhir",
                      "arn:aws:s3:::processed-db",
                      "arn:aws:s3:::blood-test",
                      "arn:aws:s3:::reports",
                      "arn:aws:s3:::raw-strength",
                      "arn:aws:s3:::fhir-logs",
                      "arn:aws:s3:::raw-medication"
                    ]
                  },
                  {
                    "Effect": "Allow",
                    "Action": [
                      "s3:GetObject",
                      "s3:PutObject",
                      "s3:DeleteObject"
                    ],
                    "Resource": [
                      "arn:aws:s3:::raw-iphone/*",
                      "arn:aws:s3:::raw-manual/*",
                      "arn:aws:s3:::raw-spirometer/*",
                      "arn:aws:s3:::raw-db-spirometer/*",
                      "arn:aws:s3:::processed-fhir/*",
                      "arn:aws:s3:::processed-db/*",
                      "arn:aws:s3:::blood-test/*",
                      "arn:aws:s3:::reports/*",
                      "arn:aws:s3:::raw-strength/*",
                      "arn:aws:s3:::fhir-logs/*",
                      "arn:aws:s3:::raw-medication/*"
                    ]
                  }
                ]
              }
              EOF
              
              # Recreate policy names deterministically
              # if mc admin policy info local pg-backup-policy >/dev/null 2>&1; then
              #   mc admin policy rm local pg-backup-policy || true
              # fi
              mc admin policy create local pg-backup-policy /tmp/pgbackup-policy.json

              # if mc admin policy info local api-policy >/dev/null 2>&1; then
              #   mc admin policy rm local api-policy || true
              # fi
              mc admin policy create local api-policy /tmp/api-policy.json

              # if mc admin policy info local medplum-policy >/dev/null 2>&1; then
              #   mc admin policy rm local medplum-policy || true
              # fi
              mc admin policy create local medplum-policy /tmp/medplum-policy.json

              echo "==> Attach policies to users"
              # mc admin policy attach requires exactly one --user or --group :contentReference[oaicite:2]{index=2}
              mc admin policy attach local pg-backup-policy --user "$PG_BACKUP_ACCESS_KEY" || true
              mc admin policy attach local medplum-policy --user "$MEDPLUM_ACCESS_KEY" || true
              mc admin policy attach local api-policy --user "$API_ACCESS_KEY" || true

              echo "==> Attach policies to user : admin"
              mc admin policy info local consoleAdmin >/dev/null 2>&1 || {
                echo "ERREUR: policy builtin 'consoleAdmin' introuvable sur ce MinIO"
                mc admin policy list local || true
                exit 1
              }
              mc admin policy attach local consoleAdmin --user "$CONSOLE_ACCESS_KEY"

              echo "==> Ensure bucket airflow-logs exists"
              mc mb --ignore-existing local/airflow-logs
              echo "==> Configure lifecycle for airflow-logs (${AIRFLOW_LOGS_RETENTION_DAYS} days)"
              mc ilm rule remove --all --force local/airflow-logs || true
              mc ilm rule add local/airflow-logs --expire-days "${AIRFLOW_LOGS_RETENTION_DAYS}"

              echo "==> (Re)create policy airflow-logs-rw"
              cat >/tmp/airflow-logs-policy.json <<'EOF'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": [
                      "s3:GetBucketLocation",
                      "s3:ListBucket"
                    ],
                    "Resource": [
                      "arn:aws:s3:::airflow-logs"
                    ]
                  },
                  {
                    "Effect": "Allow",
                    "Action": [
                      "s3:GetObject",
                      "s3:PutObject",
                      "s3:DeleteObject"
                    ],
                    "Resource": [
                      "arn:aws:s3:::airflow-logs/*"
                    ]
                  }
                ]
              }
              EOF

              mc admin policy rm local airflow-logs-rw >/dev/null 2>&1 || true
              mc admin policy create local airflow-logs-rw /tmp/airflow-logs-policy.json

              echo "==> (Re)create user for airflow logs"
              mc admin user remove local "$AIRFLOW_LOGS_ACCESS_KEY" >/dev/null 2>&1 || true
              mc admin user add local "$AIRFLOW_LOGS_ACCESS_KEY" "$AIRFLOW_LOGS_SECRET_KEY"
              mc admin policy attach local airflow-logs-rw --user "$AIRFLOW_LOGS_ACCESS_KEY" || true

              echo "==> (Re)create policy prometheus-metrics-read"
              cat >/tmp/prometheus-metrics-read.json <<'EOF'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": [
                      "admin:Prometheus"
                    ]
                  }
                ]
              }
              EOF
              mc admin policy rm local prometheus-metrics-read >/dev/null 2>&1 || true
              ls -lah /tmp/
              cat /tmp/prometheus-metrics-read.json
              mc admin policy create local prometheus-metrics-read /tmp/prometheus-metrics-read.json || true
 

              echo "==> (Re)create user for prometheus"
              mc admin user remove local "$PROMETHEUS_USER" >/dev/null 2>&1 || true
              mc admin user add local "$PROMETHEUS_USER" "$PROMETHEUS_PASSWORD"  || true
              mc admin policy attach local prometheus-metrics-read --user "$PROMETHEUS_USER" ||true

              echo "==> Sanity checks"
              mc admin policy entities local --policy pg-backup-policy || true
              mc admin policy entities local --policy api-policy || true
              mc admin policy entities local --policy medplum-policy || true
              mc admin policy entities local --policy consoleAdmin || true
              mc admin policy entities local --policy airflow-logs-rw || true
              mc admin policy entities local --policy prometheus-metrics-read || true

              echo "✅ MinIO init done"

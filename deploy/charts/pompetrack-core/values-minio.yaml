minio:
  mode: standalone

  existingSecret: minio-root

  replicas: 1

  persistence:
    enabled: true
    size: 20Gi
    storageClass: local-path

  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2Gi

  service:
    type: ClusterIP

  consoleService:
    type: ClusterIP

  # extraEnvVars:
  #   - name: MINIO_PROMETHEUS_AUTH_TYPE
  #     value: "public"

postgresql:
  auth:
    username: myuser
    password: mypassword
    database: mydb

  primary:
    persistence:
      enabled: true
      size: 4Gi

prometheus-postgres-exporter:
  enabled: true
  fullnameOverride: "pompetrack-core-postgres-exporter"
  config:
    datasource:
      host: "airflow-postgresql.airflow.svc.cluster.local"
      user: "postgres"
      passwordSecret:
        name: airflow-postgresql-auth
        key: postgres-password
      port: "5432"
      database: "airflow"
      sslmode: disable
kube-prometheus-stack:

  fullnameOverride: prometheus

  ## ---------------------------
  ## GLOBAL
  ## ---------------------------
  global:
    rbac:
      create: true

  ## ---------------------------
  ## PROMETHEUS
  ## ---------------------------
  prometheus:
    prometheusSpec:
      replicas: 1

      retention: 10d

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: "local-path"
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

      resources:
        requests:
          memory: 512Mi
          cpu: 200m
        limits:
          memory: 2Gi
          cpu: 1000m

      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}

      additionalScrapeConfigs:
        - job_name: 'proxmox'
          static_configs:
            - targets: ['192.168.2.5:9221']
          metrics_path: /metrics
          params:
            module: [default]
            target: ['192.168.2.5']

        - job_name: 'traefik'
          static_configs:
            - targets:
              # Traefik dans kube-system, port métriques 8082
              - 'traefik.kube-system.svc.cluster.local:8082'

      podMetadata:
        annotations:
          traffic.sidecar.istio.io/excludeOutboundPorts: "9100"

  ## ---------------------------
  ## ALERTMANAGER
  ## ---------------------------
  alertmanager:
    enabled: true
    tplConfig: false

    alertmanagerSpec:
      replicas: 1
      secrets:
        - alertmanager-telegram-bot
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: "local-path"
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

    config:
      global:
        resolve_timeout: 5m

      route:
        receiver: "telegram-medplum"
        group_by:
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h

      receivers:
        - name: "null"

        - name: "telegram-medplum"
          telegram_configs:
            - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram-bot/bot-token
              chat_id: 1970193166
              send_resolved: true
              parse_mode: "HTML"
              message: |-
                {{ if eq .Status "firing" }}🚨 <b>ALERTE</b>{{ else }}✅ <b>RÉSOLU</b>{{ end }}

                {{ range .Alerts }}
                <b>Alerte :</b> {{ .Labels.alertname }}
                {{ if .Labels.instance }}<b>Instance :</b> {{ .Labels.instance }}{{ end }}
                {{ if .Labels.severity }}<b>Gravité :</b> {{ .Labels.severity }}{{ end }}
                {{ if .Labels.category }}<b>Catégorie :</b> {{ .Labels.category }}{{ end }}

                {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ end }}
                {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}

                {{ end }}

  ## ---------------------------
  ## GRAFANA
  ## ---------------------------
  grafana:
    enabled: true

    admin:
      existingSecret: "grafana-admin-secret"
      userKey: "admin-user"
      passwordKey: "admin-password"

    persistence:
      enabled: true
      storageClassName: "local-path"
      accessModes:
        - ReadWriteOnce
      size: 5Gi

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

    service:
      type: NodePort
      nodePort: 30007

    defaultDashboardsEnabled: true
    sidecar:
      datasources:
        enabled: true
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          # - name: 'default'
          #   orgId: 1
          #   folder: 'General'
          #   type: file
          #   disableDeletion: false
          #   editable: true
          #   options:
          #     path: /var/lib/grafana/dashboards/default
          - name: 'kubernetes'
            orgId: 1
            folder: 'Kubernetes'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes
          - name: 'databases'
            orgId: 1
            folder: 'Databases'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/databases
          - name: 'infrastructure'
            orgId: 1
            folder: 'Infrastructure'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/infrastructure
    dashboardsConfigMaps:
      kubernetes: "grafana-dashboards-kubernetes"
      databases: "grafana-dashboards-databases"
      infrastructure: "grafana-dashboards-infrastructure"
      

  ## ---------------------------
  ## NODE EXPORTER
  ## ---------------------------
  nodeExporter:
    enabled: true
    hostNetwork: false

  ## ---------------------------
  ## KUBE STATE METRICS
  ## ---------------------------
  kubeStateMetrics:
    enabled: true

  ## ---------------------------
  ## COMPONENTS K3s CLEANUP
  ## ---------------------------
  kubeControllerManager:
    enabled: false

  kubeScheduler:
    enabled: false

  kubeProxy:
    enabled: false

  kubeEtcd:
    enabled: false

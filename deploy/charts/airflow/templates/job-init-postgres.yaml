apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-db-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure 
      containers:
        - name: init-db
          image: docker.io/bitnamilegacy/postgresql:16.1.0-debian-11-r15
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-postgresql-auth
                  key: postgres-password
            - name: AIRFLOW_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-postgresql-auth
                  key: password
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              psql -h airflow-postgresql \
                   -U postgres \
                   -d postgres \
                   -v ON_ERROR_STOP=1 \
                   -v airflow_password="$AIRFLOW_DB_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE airflow WITH LOGIN PASSWORD %L', :'airflow_password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'airflow') \gexec
              SQL

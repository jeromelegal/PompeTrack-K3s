apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: airflow-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow
        app.kubernetes.io/component: postgresql
    spec:
      securityContext:
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgresql
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: "airflow"
            - name: POSTGRES_DB
              value: "airflow"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-postgresql
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: {{ .Values.resources.postgresql.requests.cpu | quote }}
              memory: {{ .Values.resources.postgresql.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.postgresql.limits.cpu | quote }}
              memory: {{ .Values.resources.postgresql.limits.memory | quote }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - airflow
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - airflow
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
        labels:
          app.kubernetes.io/name: airflow
          app.kubernetes.io/component: postgresql
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.storage.postgresql.storageClass }}
        resources:
          requests:
            storage: {{ .Values.storage.postgresql.size }}

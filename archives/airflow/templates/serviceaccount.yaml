{{/*
=============================================================================
Service Account
=============================================================================
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "airflow.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "airflow.labels" . | nindent 4 }}

---
{{/*
=============================================================================
ClusterRole - permissions pour KubernetesExecutor
=============================================================================
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "airflow.name" . }}-cluster-role
  labels:
    {{- include "airflow.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

---
{{/*
=============================================================================
ClusterRoleBinding
=============================================================================
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "airflow.name" . }}-cluster-role-binding
  labels:
    {{- include "airflow.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "airflow.name" . }}-cluster-role
subjects:
  - kind: ServiceAccount
    name: {{ include "airflow.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

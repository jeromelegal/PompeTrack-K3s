apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "airflow.name" . }}-api-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "airflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "airflow.name" . }}
      app.kubernetes.io/component: api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "airflow.name" . }}
        app.kubernetes.io/component: api-server
    spec:
      serviceAccountName: {{ include "airflow.serviceAccountName" . }}
      securityContext:
        runAsUser: 50000
        fsGroup: 50000
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "airflow.name" . }}-postgresql 5432; do
                echo "Waiting for PostgreSQL...";
                sleep 3;
              done
      containers:
        - name: api-server
          image: {{ .Values.images.airflow.repository }}:{{ .Values.images.airflow.tag }}
          imagePullPolicy: {{ .Values.images.airflow.pullPolicy }}
          command: ["airflow", "api-server"]
          envFrom:
            - configMapRef:
                name: {{ include "airflow.name" . }}-config
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: airflow-db-conn
                  key: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: airflow-core
                  key: AIRFLOW__CORE__FERNET_KEY
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: airflow-core
                  key: AIRFLOW__WEBSERVER__SECRET_KEY
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.resources.apiServer.requests.cpu | quote }}
              memory: {{ .Values.resources.apiServer.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.apiServer.limits.cpu | quote }}
              memory: {{ .Values.resources.apiServer.limits.memory | quote }}
          volumeMounts:
            - name: logs
              mountPath: /opt/airflow/logs
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: {{ include "airflow.name" . }}-logs

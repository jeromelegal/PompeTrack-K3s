apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "airflow.name" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "airflow.labels" . | nindent 4 }}
data:
  # ---------------------------------------------------------------------------
  # Core
  # ---------------------------------------------------------------------------
  AIRFLOW__CORE__EXECUTOR: "KubernetesExecutor"
  AIRFLOW__CORE__LOAD_EXAMPLES: {{ .Values.airflow.config.AIRFLOW__CORE__LOAD_EXAMPLES | quote }}
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: {{ .Values.airflow.config.AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION | quote }}
  AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags"

  # ---------------------------------------------------------------------------
  # Logging
  # ---------------------------------------------------------------------------
  AIRFLOW__LOGGING__LOGGING_LEVEL: {{ .Values.airflow.config.AIRFLOW__LOGGING__LOGGING_LEVEL | quote }}
  AIRFLOW__LOGGING__BASE_LOG_FOLDER: "/opt/airflow/logs"

  # ---------------------------------------------------------------------------
  # Kubernetes Executor
  # ---------------------------------------------------------------------------
  AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE: {{ .Release.Namespace | quote }}
  AIRFLOW__KUBERNETES_EXECUTOR__WORKER_CONTAINER_REPOSITORY: {{ .Values.images.airflow.repository | quote }}
  AIRFLOW__KUBERNETES_EXECUTOR__WORKER_CONTAINER_TAG: {{ .Values.images.airflow.tag | quote }}
  AIRFLOW__KUBERNETES_EXECUTOR__POD_TEMPLATE_FILE: "/opt/airflow/pod_template.yaml"

  # ---------------------------------------------------------------------------
  # API Server (Airflow 3)
  # ---------------------------------------------------------------------------
  AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.jwt_auth"

  # ---------------------------------------------------------------------------
  # Pod template pour les workers
  # ---------------------------------------------------------------------------
  pod_template.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: airflow-worker
      namespace: {{ .Release.Namespace }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      containers:
        - name: base
          image: {{ .Values.images.airflow.repository }}:{{ .Values.images.airflow.tag }}
          imagePullPolicy: {{ .Values.images.airflow.pullPolicy }}
          resources:
            requests:
              cpu: {{ .Values.resources.worker.requests.cpu | quote }}
              memory: {{ .Values.resources.worker.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.worker.limits.cpu | quote }}
              memory: {{ .Values.resources.worker.limits.memory | quote }}
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: logs
              mountPath: /opt/airflow/logs
      volumes:
        - name: dags
          persistentVolumeClaim:
            claimName: airflow-dags
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs

# =============================================================================
# Images
# =============================================================================
images:
  airflow:
    repository: apache/airflow
    tag: "3.0.0"
    pullPolicy: IfNotPresent

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  name: airflow

# =============================================================================
# Airflow configuration
# =============================================================================
airflow:
  executor: KubernetesExecutor
  fernetKeySecret: airflow-core
  webserverSecretKey: airflow-core
  config:
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"

# =============================================================================
# Resources
# =============================================================================
resources:
  scheduler:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  apiServer:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"
  dagProcessor:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"
  worker:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# =============================================================================
# Storage
# =============================================================================
storage:
  dags:
    size: 1Gi
    storageClass: ""
  logs:
    size: 2Gi
    storageClass: ""

# =============================================================================
# Ingress
# =============================================================================
ingress:
  enabled: true
  className: nginx
  host: airflow.local
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  tls:
    enabled: false
    secretName: airflow-tls

# =============================================================================
# PostgreSQL (subchart Bitnami)
# =============================================================================
postgresql:
  auth:
    existingSecret: airflow-db-credentials
    secretKeys:
      adminPasswordKey: password
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
